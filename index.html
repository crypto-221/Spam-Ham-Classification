<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spam or Ham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --jet:#0a0a0b; --jet-2:#141417; --line:#2a2a31;
  --cerulean:#2a9fe0; --rose:#ff2d95;
  --text:#ecedf0; --muted:#8b8d98;
  --display:"Bricolage Grotesque","Arial Black",sans-serif;
  --body:"Instrument Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{font-size:18px}
body{background:var(--jet);color:var(--text);font-family:var(--body);min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;padding:min(12vh,90px) 20px 40px}
.wrap{width:100%;max-width:520px}

h1{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:-.03em;line-height:1}
h1 .a{color:var(--rose)} h1 .b{color:var(--cerulean)}
.sub{color:var(--muted);margin:10px 0 26px}

textarea{width:100%;height:130px;resize:vertical;background:var(--jet-2);color:var(--text);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;line-height:1.5}
textarea::placeholder{color:#5f616c}
textarea:focus{outline:2px solid var(--cerulean);outline-offset:2px;border-color:transparent}

.row{display:flex;gap:10px;margin-top:14px;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:999px;padding:11px 24px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--text);text-decoration:none}
.btn:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.primary{background:var(--cerulean);border-color:var(--cerulean);color:#04121c}
.primary:hover{filter:brightness(1.1)}
.ghost:hover{border-color:var(--muted)}

.samples{margin-top:16px;font-size:.8rem;color:var(--muted)}
.samples button{font:inherit;font-size:.8rem;margin-left:6px;padding:4px 12px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.samples button:hover{color:var(--text);border-color:var(--muted)}

/* result: sirf ek line, koi bada box nahi */
.result{margin-top:26px;display:flex;align-items:center;gap:14px}
.pill{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.02em;
  padding:6px 22px;border-radius:999px;border:2px solid}
.pill.spam{color:var(--rose);border-color:var(--rose);box-shadow:0 0 22px -4px var(--rose)}
.pill.ham{color:var(--cerulean);border-color:var(--cerulean);box-shadow:0 0 22px -4px var(--cerulean)}
.result span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="a">Spam</span> or <span class="b">Ham</span>?</h1>
  <p class="sub">Paste an SMS or email to check it.</p>

  <form method="POST" action="/">
    <textarea id="msg" name="message" placeholder="Paste your message here…" required>{{ message }}</textarea>
    <div class="row">
      <button class="btn primary" type="submit">Check message</button>
      <a class="btn ghost" href="/">Clear</a>
    </div>
  </form>

  {% if result %}
  <div class="result">
    <div class="pill {{ result }}">{{ result.upper() }}</div>
    <span>{% if result == 'spam' %}Do not click any links.{% else %}Looks like a normal message.{% endif %}</span>
  </div>
  {% endif %}


<script>
document.querySelectorAll("[data-s]").forEach(b =>
  b.onclick = () => { document.getElementById("msg").value = b.dataset.s; });
</script>
</body>
</html>
